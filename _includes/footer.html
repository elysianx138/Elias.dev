<footer class="site-footer">
  <div class="container">
    <div class="site-footer__top">
      <div class="site-footer__brand">
        <span class="site-footer__name">{{ site.title | escape }}</span>
        <span class="site-footer__tag mono">{{ site.subtitle | escape }}</span>
      </div>
      <div class="site-footer__socials">
        {%- for social in site.data.social -%}
          <a class="footer-icon" href="{{ social.url }}" target="_blank" rel="noopener"
             aria-label="{{ social.name | escape }}">
            {% include icons.html icon=social.icon %}
          </a>
        {%- endfor -%}
      </div>
    </div>
    <div class="site-footer__bottom">
      <span>&copy; {{ site.time | date: "%Y" }} {{ site.author | escape }}.</span>
      <span>Built with Jekyll · Crafted by hand.</span>
      <a class="mono" href="{{ "/feed.xml" | relative_url }}">RSS</a>
    </div>
  </div>
</footer>
