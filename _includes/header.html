<header class="site-header">
  <div class="wrapper">
    <div class="site-header__inner">
      <a class="site-brand" href="{{ "/" | relative_url }}">
        <span class="site-brand__prompt mono" aria-hidden="true">$</span>
        <span class="site-brand__name mono">{{ site.title | escape }}</span>
        <span class="site-brand__path mono" aria-hidden="true">&Lowbar;</span>
      </a>

      <nav class="site-nav" aria-label="Primary">
        <input type="checkbox" id="nav-trigger" class="nav-trigger" />
        <label for="nav-trigger" class="nav-toggle" aria-label="Toggle menu">&#9776;</label>

        <ul class="nav-links">
          <li><a class="site-nav__link js-anchor" href="#whoami">About</a></li>
          <li><a class="site-nav__link js-anchor" href="#languages">Stack</a></li>
          <li><a class="site-nav__link js-anchor" href="#blog">Writing</a></li>
          <li><a class="site-nav__link js-anchor" href="#projects">Projects</a></li>
          <li><a class="site-nav__link js-anchor" href="#contact">Contact</a></li>
          <li><a class="site-nav__link site-nav__link--ext" href="mailto:{{ site.email }}">Email</a></li>
          {%- for social in site.data.social -%}
            {%- if social.icon == 'github' -%}
          <li><a class="site-nav__link site-nav__link--ext" href="{{ social.url }}" target="_blank" rel="noopener">GitHub</a></li>
            {%- endif -%}
          {%- endfor -%}
        </ul>
      </nav>
    </div>
  </div>
</header>
