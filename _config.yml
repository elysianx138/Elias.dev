# ──────────────────────────────────────────────
#  Site settings
# ──────────────────────────────────────────────
title: Elias's Blog
subtitle: Code, Thoughts & Life
description: >-
  A personal blog about programming, technology, and life.
author: elysianx138
email: elysianx138@gmail.com
avatar: /assets/images/avatar.jpg

# ──────────────────────────────────────────────
#  URL settings
# ──────────────────────────────────────────────
url: "https://elysianx138.github.io"
baseurl: "/Elias.dev"

# ──────────────────────────────────────────────
#  Social links
# ──────────────────────────────────────────────
github_username:  elysianx138
rss:              true

# ──────────────────────────────────────────────
#  Build settings
# ──────────────────────────────────────────────
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

theme: null

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# ──────────────────────────────────────────────
#  Exclude from build
# ──────────────────────────────────────────────
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .gitignore
  - README.md

# ──────────────────────────────────────────────
#  Defaults
# ──────────────────────────────────────────────
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
      toc: true
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# ──────────────────────────────────────────────
#  Pagination
# ──────────────────────────────────────────────
paginate: 10
paginate_path: "/page:num/"
