# ──────────────────────────────────────────────
#  Site settings
# ──────────────────────────────────────────────
title: Elias Song
subtitle: C++ · Python · Open Source
description: >-
  Personal site and blog of Elias Song, a developer working with C++ and Python
  who loves open source. Sharing what I build and what I learn.
author: Elias Song
email: elysianx138@gmail.com

# ──────────────────────────────────────────────
#  URL settings
# ──────────────────────────────────────────────
url: "https://elysianx138.github.io"
baseurl: "/Elias.dev"

# ──────────────────────────────────────────────
#  Blog / community accounts
# ──────────────────────────────────────────────
devto_username:    elysianx138
coderlegion_user:  elysianx
coderlegion_url:   "https://coderlegion.com/user/elysianx"
rss:              true

# ──────────────────────────────────────────────
#  Build settings
# ──────────────────────────────────────────────
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

theme: null

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# ──────────────────────────────────────────────
#  Exclude from build
# ──────────────────────────────────────────────
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .gitignore
  - README.md

# ──────────────────────────────────────────────
#  Defaults
# ──────────────────────────────────────────────
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
      toc: true
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# ──────────────────────────────────────────────
#  Pagination
# ──────────────────────────────────────────────
paginate: 10
paginate_path: "/page:num/"